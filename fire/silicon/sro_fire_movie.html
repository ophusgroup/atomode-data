<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>tricor trajectory viewer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #333; }
  #container { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; background: #f7f8f5; }
  /* Explicit grid-row assignments so the layout stays correct when
     #title is empty (its ``:empty { display: none }`` rule would
     otherwise shift #canvas-wrap into the auto slot and let
     #controls balloon into the 1fr slot). */
  #title { grid-row: 1; padding: 8px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.06); background: rgba(255,255,255,0.5); }
  #title:empty { display: none; }
  #canvas-wrap { grid-row: 2; min-height: 0; position: relative; }
  #controls { grid-row: 3; padding: 10px 16px; background: rgba(255,255,255,0.6); border-top: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; gap: 12px; font-size: 12px; }
  .btn { padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #eef2ea; }
  .btn.active { background: #2a6e4e; color: #fff; border-color: #2a6e4e; }
  #slider { flex: 1; min-width: 100px; }
  #frame-label { min-width: 70px; font-variant-numeric: tabular-nums; }
  #speed-label { min-width: 60px; font-variant-numeric: tabular-nums; }

  /* Colorbar legend overlay */
  #legend {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.7);
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.08);
    font-size: 11px;
    pointer-events: none;
    user-select: none;
  }
  #legend.on { display: flex; }
  #legend-title { font-weight: 600; margin-bottom: 6px; font-size: 11px; color: #333; }
  #legend-body { display: flex; align-items: center; gap: 6px; }
  #legend-bar {
    width: 16px;
    height: 160px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.15);
  }
  #legend-ticks {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 160px;
    font-variant-numeric: tabular-nums;
    color: #333;
  }
</style>
</head>

<div id="container">

        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="play">Play</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="loop">Loop</button>

    <input type="range" id="slider" min="0" max="0" step="1" value="0"/>
    <span id="speed-label">1x</span>
    <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"/>
  </div>
</div>

// Polynomial approximation - produces [r,g,b] in [0,1].
function turbo(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.max(0, Math.min(1,
    0.13572138 + t * (4.61539260 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943))))));

    0.10667330 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973))))));
  return [r, g, b];
}

// Build CSS gradient for the colorbar
function buildTurboGradient(steps) {
  const stops = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const [r, g, b] = turbo(t);
    const pct = (100 * t).toFixed(1);
    // CSS gradient renders top-to-bottom by default, so reverse by using 1-t for display
    stops.push(`rgb(${Math.round(r*255)}, ${Math.round(g*255)}, ${Math.round(b*255)}) ${pct}%`);
  }
  return `linear-gradient(to top, ${stops.join(", ")})`;
}

  function _buildPolyGroup(groupCfg) {
    const nVerts = groupCfg.n_vertices;
    const centers = groupCfg.centers || [];
    const vertexIdx = groupCfg.vertex_indices || [];
    const numPoly = groupCfg.num || 0;
    const sharedFaces = groupCfg.faces || [[0,1,2],[0,1,3],[0,2,3],[1,2,3]];
    const sharedEdges = groupCfg.edges || [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
    const perPoly = !!groupCfg.per_polyhedron_topology;
    const facesPerPoly = groupCfg.faces_per_poly || [];
    const edgesPerPoly = groupCfg.edges_per_poly || [];
    const scale = (typeof groupCfg.scale === "number") ? groupCfg.scale : 1.0;
    const color = groupCfg.color || [0.25, 0.65, 0.95];
    const opacity = (typeof groupCfg.opacity === "number") ? groupCfg.opacity : 0.35;

    const facesByPoly = [];
    const edgesByPoly = [];
    let totalFaces = 0;
    let totalEdges = 0;
    if (perPoly) {
      for (let t = 0; t < numPoly; t++) {
        facesByPoly.push(facesPerPoly[t] || []);
        edgesByPoly.push(edgesPerPoly[t] || []);
        totalFaces += facesByPoly[t].length;
        totalEdges += edgesByPoly[t].length;
      }
    } else {
      for (let t = 0; t < numPoly; t++) {
        facesByPoly.push(sharedFaces);
        edgesByPoly.push(sharedEdges);
      }
      totalFaces = numPoly * sharedFaces.length;
      totalEdges = numPoly * sharedEdges.length;
    }
    if (numPoly === 0) return null;

    const facePositions = new Float32Array(totalFaces * 3 * 3);
    const faceGeo = new THREE.BufferGeometry();
    faceGeo.setAttribute("position", new THREE.BufferAttribute(facePositions, 3));
    const mat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(color[0], color[1], color[2]),
      shininess: 20,
      specular: 0x888888,
      transparent: true,
      opacity: opacity,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(faceGeo, mat);
    mesh.frustumCulled = false;
    scene.add(mesh);

    const edgePositions = new Float32Array(totalEdges * 2 * 3);
    const edgeGeo = new THREE.BufferGeometry();
    edgeGeo.setAttribute("position", new THREE.BufferAttribute(edgePositions, 3));
    const edgeMat = new THREE.LineBasicMaterial({
      color: 0x111111,
      transparent: true,
      opacity: 0.55,
    });
    scene.add(new THREE.LineSegments(edgeGeo, edgeMat));
    return {
      nVerts, centers, vertexIdx, numPoly,
      facesByPoly, edgesByPoly,
      scale,
      mesh, faceGeo, facePositions,
      edgeGeo, edgePositions,
    };
  }

  const legacyTetraMode = !!DATA.tetrahedra_mode && (DATA.num_tetrahedra || 0) > 0;
  const multiMode = !!DATA.polyhedra_multi_mode && Array.isArray(DATA.polyhedra_groups);
  if (multiMode) {
    for (const g of DATA.polyhedra_groups) {
      const built = _buildPolyGroup(g);
      if (built) polyhedraGroups.push(built);
    }
  } else if (legacyTetraMode) {
    const legacyGroup = {
      n_vertices: DATA.polyhedra_n_vertices || 4,
      centers: DATA.tetrahedra_centers || [],
      vertex_indices: DATA.tetrahedra_vertex_indices || [],
      num: DATA.num_tetrahedra || 0,
      faces: DATA.polyhedra_faces || [[0,1,2],[0,1,3],[0,2,3],[1,2,3]],
      edges: DATA.polyhedra_edges || [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]],
      per_polyhedron_topology: !!DATA.polyhedra_per_polyhedron_topology,
      faces_per_poly: DATA.polyhedra_faces_per_poly || [],
      edges_per_poly: DATA.polyhedra_edges_per_poly || [],
      scale: (typeof DATA.polyhedra_scale === "number") ? DATA.polyhedra_scale : 1.0,
      color: DATA.tetrahedra_color || [0.25, 0.65, 0.95],
      opacity: DATA.tetrahedra_opacity != null ? DATA.tetrahedra_opacity : 0.35,
    };
    const built = _buildPolyGroup(legacyGroup);
    if (built) polyhedraGroups.push(built);
  }

  function updateTetrahedra(frameOffset) {
    if (polyhedraGroups.length === 0) return;
    for (const group of polyhedraGroups) {
      const V = [];
      for (let v = 0; v < group.nVerts; v++) V.push(new Array(3));
      let faceOut = 0;
      let edgeOut = 0;
      for (let t = 0; t < group.numPoly; t++) {
        const ci = group.centers[t];
        const cx = positions[frameOffset + ci*3];
        const cy = positions[frameOffset + ci*3 + 1];
        const cz = positions[frameOffset + ci*3 + 2];
        for (let v = 0; v < group.nVerts; v++) {
          const vi = group.vertexIdx[t*group.nVerts + v];
          const vx = positions[frameOffset + vi*3];
          const vy = positions[frameOffset + vi*3 + 1];
          const vz = positions[frameOffset + vi*3 + 2];
          const mi = minImage(vx - cx, vy - cy, vz - cz);
          V[v][0] = cx + group.scale * mi[0];
          V[v][1] = cy + group.scale * mi[1];
          V[v][2] = cz + group.scale * mi[2];
        }
        const faces = group.facesByPoly[t];
        for (let f = 0; f < faces.length; f++) {
          const [a, b, cc] = faces[f];
          const outBase = faceOut * 9;
          group.facePositions[outBase+0] = V[a][0];
          group.facePositions[outBase+1] = V[a][1];
          group.facePositions[outBase+2] = V[a][2];
          group.facePositions[outBase+3] = V[b][0];
          group.facePositions[outBase+4] = V[b][1];
          group.facePositions[outBase+5] = V[b][2];
          group.facePositions[outBase+6] = V[cc][0];
          group.facePositions[outBase+7] = V[cc][1];
          group.facePositions[outBase+8] = V[cc][2];
          faceOut++;
        }
        const edges = group.edgesByPoly[t];
        for (let e = 0; e < edges.length; e++) {
          const [a, b] = edges[e];
          const outBase = edgeOut * 6;
          group.edgePositions[outBase+0] = V[a][0];
          group.edgePositions[outBase+1] = V[a][1];
          group.edgePositions[outBase+2] = V[a][2];
          group.edgePositions[outBase+3] = V[b][0];
          group.edgePositions[outBase+4] = V[b][1];
          group.edgePositions[outBase+5] = V[b][2];
          edgeOut++;
        }
      }
      group.mesh.geometry.attributes.position.needsUpdate = true;
      group.mesh.geometry.computeVertexNormals();
      group.edgeGeo.attributes.position.needsUpdate = true;
    }
  }

  function renderFrame(frameIdx) {
    const frameOffset = frameIdx * n * 3;
    const costOffset = hasCost ? frameIdx * n : 0;

    // Update atom positions, scales, and (optionally) colours
    for (let i = 0; i < n; i++) {
      const x = positions[frameOffset + i*3];
      const y = positions[frameOffset + i*3 + 1];
      const z = positions[frameOffset + i*3 + 2];
      const r = atomRadii[i] * atomScale;
      dummy.position.set(x, y, z);
      dummy.scale.set(r, r, r);
      dummy.updateMatrix();
      atomMesh.setMatrixAt(i, dummy.matrix);

      // Outline sphere: absolute thickness in world units
      const ro = r + outlineThickness;
      dummy.scale.set(ro, ro, ro);
      dummy.updateMatrix();
      outlineMesh.setMatrixAt(i, dummy.matrix);

      if (hasCost) {
        const c = atomCost[costOffset + i];
        const t = (c - cMin) / cRange;
        const [cr, cg, cb] = turbo(t);
        color.setRGB(cr, cg, cb);
        atomMesh.setColorAt(i, color);
      }
    }
    atomMesh.instanceMatrix.needsUpdate = true;
    outlineMesh.instanceMatrix.needsUpdate = true;
    if (hasCost) {
      atomMesh.instanceColor.needsUpdate = true;
    }

    // Update bond cylinders (minimum-image applied)
    for (let k = 0; k < nb; k++) {
      const i = bondI[k];
      const j = bondJ[k];

      if (hasCost) {
        // Colour bond by mean atom cost of its two endpoints
        const ci = atomCost[costOffset + i];
        const cj = atomCost[costOffset + j];
        const tb = 0.5 * (ci + cj - 2.0 * cMin) / cRange;
        const [br, bg, bb] = turbo(tb);
        color.setRGB(br, bg, bb);
        bondMesh.setColorAt(k, color);
      }

      const sx = positions[frameOffset + i*3];
      const sy = positions[frameOffset + i*3 + 1];
      const sz = positions[frameOffset + i*3 + 2];
      const ex = positions[frameOffset + j*3];
      const ey = positions[frameOffset + j*3 + 1];
      const ez = positions[frameOffset + j*3 + 2];
      const mi = minImage(ex - sx, ey - sy, ez - sz);
      const exw = sx + mi[0];
      const eyw = sy + mi[1];
      const ezw = sz + mi[2];
      const d = Math.sqrt(mi[0]*mi[0] + mi[1]*mi[1] + mi[2]*mi[2]);
      if (d > 5.0) {
        dummy.scale.set(0, 0, 0);
        dummy.updateMatrix();
        bondMesh.setMatrixAt(k, dummy.matrix);
        bondOutlineMesh.setMatrixAt(k, dummy.matrix);
        continue;
      }
      start.set(sx, sy, sz);
      end.set(exw, eyw, ezw);
      mid.addVectors(start, end).multiplyScalar(0.5);
      dir.subVectors(end, start);
      const len = dir.length();
      dir.normalize();
      dummy.position.copy(mid);
      quat.setFromUnitVectors(up, dir);
      dummy.quaternion.copy(quat);
      dummy.scale.set(bondRadius, len, bondRadius);
      dummy.updateMatrix();
      bondMesh.setMatrixAt(k, dummy.matrix);

      // Outline cylinder: absolute thickness in world units (matches atoms)
      const bondOutlineRadius = bondRadius + outlineThickness;
      dummy.scale.set(bondOutlineRadius, len, bondOutlineRadius);
      dummy.updateMatrix();
      bondOutlineMesh.setMatrixAt(k, dummy.matrix);
    }
    if (nb > 0) {
      bondMesh.instanceMatrix.needsUpdate = true;
      bondOutlineMesh.instanceMatrix.needsUpdate = true;
      if (hasCost && bondMesh.instanceColor) {
        bondMesh.instanceColor.needsUpdate = true;
      }
    }

    updateTetrahedra(frameOffset);
  }

  // Camera framing: look down the +x axis so the yz face fills the viewport.
  // The cell is already centred at the origin by the exporter.
  const cellHalfX = 0.5 * Math.abs(cell[0]);
  const cellHalfY = 0.5 * Math.abs(cell[4]);
  const cellHalfZ = 0.5 * Math.abs(cell[8]);
  // Fit tolerance: smaller = tighter zoom, larger = more margin.
  // 1.0 gives ~20% padding around the cell so sp² triangles and
  // sp³ tetrahedra at the box faces stay in the viewport.
  const FRAME_FIT = 1.0;

  function framedCameraDistance(aspect) {
    const fovV = camera.fov * Math.PI / 180;
    const tanV = Math.tan(fovV / 2);
    const distV = cellHalfY / tanV;               // fit full height
    const distH = cellHalfZ / (aspect * tanV);    // fit full width
    const dist = Math.max(distV, distH) * FRAME_FIT;
    return cellHalfX + dist;
  }

  let cameraFramed = false;
  function frameCamera(aspect) {
    const camX = framedCameraDistance(aspect);
    camera.position.set(camX, 0, 0);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    controls.target.set(0, 0, 0);
    controls.update();
    cameraFramed = true;
  }

  // Resize handling
  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    if (w === 0 || h === 0) return;
    const aspect = w / h;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (!cameraFramed) {
      frameCamera(aspect);
    }
  }
  new ResizeObserver(resize).observe(wrap);

  // Animation controls
  let currentFrame = 0;
  let isPlaying = false;
  let isLooping = true;
  let isBouncing = false;
  let direction = 1;          // +1 = forward, -1 = reverse (bounce)
  let speed = 1.0;
  let lastTime = 0;
  let frameTimer = 0;
  const baseInterval = 1000 / 30;  // 30 fps at speed=1

  const slider = document.getElementById("slider");
  const frameLabel = document.getElementById("frame-label");
  const speedSlider = document.getElementById("speed");
  const speedLabel = document.getElementById("speed-label");
  const playBtn = document.getElementById("play");
  const restartBtn = document.getElementById("restart");
  const loopBtn = document.getElementById("loop");
  const bounceBtn = document.getElementById("bounce");

  slider.max = nf - 1;

  function updateLabel() {
    frameLabel.textContent = `${currentFrame} / ${nf - 1}`;
    slider.value = currentFrame;
  }

  function setFrame(idx) {
    currentFrame = Math.max(0, Math.min(nf - 1, idx));
    renderFrame(currentFrame);
    updateLabel();
  }

  slider.addEventListener("input", () => {
    setFrame(parseInt(slider.value, 10));
  });
  speedSlider.addEventListener("input", () => {
    speed = parseFloat(speedSlider.value);
    speedLabel.textContent = `${speed.toFixed(2)}x`;
  });
  playBtn.addEventListener("click", () => {
    isPlaying = !isPlaying;
    playBtn.textContent = isPlaying ? "Pause" : "Play";
    playBtn.classList.toggle("active", isPlaying);
    lastTime = performance.now();
    frameTimer = 0;
  });
  restartBtn.addEventListener("click", () => {
    setFrame(0);
    direction = 1;
  });
  loopBtn.classList.add("active");
  loopBtn.addEventListener("click", () => {
    isLooping = !isLooping;
    loopBtn.classList.toggle("active", isLooping);
  });
  bounceBtn.addEventListener("click", () => {
    isBouncing = !isBouncing;
    bounceBtn.classList.toggle("active", isBouncing);
    if (!isBouncing) direction = 1;
  });

  function animate(now) {
    requestAnimationFrame(animate);
    if (isPlaying) {
      const dt = now - lastTime;
      lastTime = now;
      frameTimer += dt * speed;
      while (frameTimer >= baseInterval) {
        frameTimer -= baseInterval;

        if (isBouncing) {
          // Ping-pong between 0 and nf-1
          let next = currentFrame + direction;
          if (next > nf - 1) {
            direction = -1;
            next = currentFrame - 1;
          } else if (next < 0) {
            direction = 1;
            next = currentFrame + 1;
          }
          currentFrame = Math.max(0, Math.min(nf - 1, next));
        } else {
          // Forward-only: loop or stop at end
          if (currentFrame >= nf - 1) {
            if (isLooping) {
              currentFrame = 0;
            } else {
              isPlaying = false;
              playBtn.textContent = "Play";
              playBtn.classList.remove("active");
              break;
            }
          } else {
            currentFrame += 1;
          }
        }
      }
      setFrame(currentFrame);
    }
    controls.update();
    renderer.render(scene, camera);
  }

  setFrame(0);
  resize();
  requestAnimationFrame((t) => { lastTime = t; animate(t); });
})();
</script>
</body>
</html>
